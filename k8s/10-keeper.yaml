apiVersion: v1
kind: ConfigMap
metadata:
  name: keeper-config
  namespace: ch
data:
  keeper_config.xml: |
    <clickhouse>
      <logger>
        <level>information</level>
        <console>true</console>
      </logger>
      <listen_host>0.0.0.0</listen_host>
      <max_connections>4096</max_connections>
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
          <raft_logs_level>information</raft_logs_level>
        </coordination_settings>
        <raft_configuration>
          <server><id>1</id><hostname>chk-0.chk.ch.svc.cluster.local</hostname><port>9234</port></server>
          <server><id>2</id><hostname>chk-1.chk.ch.svc.cluster.local</hostname><port>9234</port></server>
          <server><id>3</id><hostname>chk-2.chk.ch.svc.cluster.local</hostname><port>9234</port></server>
        </raft_configuration>
      </keeper_server>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: chk
  namespace: ch
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: chk
  ports:
    - name: client
      port: 9181
    - name: raft
      port: 9234
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chk
  namespace: ch
spec:
  serviceName: chk
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: chk
  template:
    metadata:
      labels:
        app: chk
    spec:
      terminationGracePeriodSeconds: 10
      initContainers:
        - name: gen-server-id
          image: clickhouse/clickhouse-keeper:24.8
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -e
              ORD=${HOSTNAME##*-}
              ID=$((ORD + 1))
              cat > /confd/server_id.xml <<EOX
              <clickhouse>
                <keeper_server>
                  <server_id>${ID}</server_id>
                </keeper_server>
              </clickhouse>
              EOX
              echo "server_id=${ID}"
          volumeMounts:
            - { name: confd, mountPath: /confd }
      containers:
        - name: keeper
          image: clickhouse/clickhouse-keeper:24.8
          imagePullPolicy: IfNotPresent
          ports:
            - { name: client, containerPort: 9181 }
            - { name: raft,   containerPort: 9234 }
          volumeMounts:
            - { name: config, mountPath: /etc/clickhouse-keeper/keeper_config.xml, subPath: keeper_config.xml }
            - { name: confd,  mountPath: /etc/clickhouse-keeper/conf.d }
            - { name: data,   mountPath: /var/lib/clickhouse }
          readinessProbe:
            tcpSocket: { port: 9181 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: keeper-config
        - name: confd
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
